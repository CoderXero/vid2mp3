<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>AudioHarbor</title><link rel="stylesheet" href="/static/app.css"></head><body><main><h1>AudioHarbor</h1><p>Local video-to-MP3 processing</p><form id="new-job"><label for="url">Video or playlist URL</label><input id="url" name="url" type="url" required maxlength="4096" placeholder="https://www.youtube.com/watch?v=..."><label><input name="playlist_mode" type="radio" value="all" checked> Process playlist</label><label><input name="playlist_mode" type="radio" value="video_only"> Video only</label><label for="quality">Quality</label><select id="quality" name="quality_mode"><option value="vbr">VBR quality 2</option><option value="cbr">CBR</option></select><button>Start discovery</button></form><section aria-live="polite"><h2>Jobs</h2><div id="jobs"></div></section></main><script src="/static/app.js"></script></body></html>
